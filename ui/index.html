<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>spz-chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Hidden until the loading screen is down (client/boot.lua): NUI pages draw
     on top of the loading screen, so this page showed through it. -->
<style>body.spz-booting { visibility: hidden !important; }</style>
<script>
  document.body.classList.add('spz-booting')
  window.addEventListener('message', function (e) {
    if (e.data && e.data.action === 'spzBooted') document.body.classList.remove('spz-booting')
  })
</script>
  <!-- Starts hidden: the client says when the player is actually in the world,
       so the box never paints over the loading screen or the spawn menu. -->
  <div id="root" class="hud-hidden">
    <!-- Docked beside the minimap. Closed it's just the launcher icon; opening
         morphs icon → small box → full-width input, then the history rises
         up out of it (see the wireframe frames 12–15). -->
    <div id="dock" class="dock faded">

      <div id="log" class="log"></div>

      <div id="bar" class="bar hidden">
        <div id="suggest" class="suggest hidden"></div>

        <!-- Emoji picker -->
        <div id="emojis" class="emojis hidden">
          <div id="emoTabs" class="emo-tabs"></div>
          <div id="emoGrid" class="emo-grid"></div>
        </div>

        <!-- GIF picker (GIPHY, searched server-side) -->
        <div id="gifs" class="gifs hidden">
          <input id="gifQ" class="gif-q" type="text" placeholder="Search GIPHY..." autocomplete="off" maxlength="50">
          <div id="gifGrid" class="gif-grid"></div>
          <div class="gif-foot">Powered by GIPHY</div>
        </div>

        <div class="chips">
          <button class="chip active" data-ch="global">Global</button>
          <button class="chip" data-ch="crew">Crew</button>
          <button class="chip" data-ch="dm">DM</button>
          <button id="emoBtn" class="chip gif-chip" type="button" title="Emoji">😀</button>
          <button id="gifBtn" class="chip gif-chip" type="button">GIF</button>
        </div>
      </div>

      <div id="launcher" class="launcher">
        <span class="launcher-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
          </svg>
          <span class="unread-dot"></span>
        </span>
        <div class="input-module">
          <input id="input" class="input" type="text" maxlength="200" placeholder="Message everyone..." autocomplete="off">
        </div>
      </div>

    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
